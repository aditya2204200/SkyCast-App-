<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Climate Analytics</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1 class="text-center mt-5">Climate Analytics</h1>
    <div class="container mt-5">
      <div class="row g-4">
        <!-- LEFT GRAPH -->
        <div class="col-lg-9">
          <div class="card analytics-card p-4">
            <div class="d-flex justify-content-between align-items-center">
              <h3>Historical Weather</h3>

              <div>
                <select class="form-select d-inline w-auto me-2">
                  <option>Last 12 Months</option>
                </select>

                <select class="form-select d-inline w-auto">
                  <option>All Months</option>
                </select>
              </div>
            </div>

            <hr />
            <div class="weather-tabs">
              <button id="tempBtn" class="active">🌡 Temperature</button>

              <button id="rainBtn">🌧 Precipitation</button>

              <button id="humidityBtn">💧 Humidity</button>

              <button id="windBtn">💨 Wind</button>
            </div>

            <canvas id="weatherChart"></canvas>
          </div>
        </div>

        <!-- RIGHT PANEL -->

        <div class="col-lg-3">
          <div class="card analytics-card p-4 text-center">
            <h4>Weather Overview</h4>

            <div class="chart-wrapper">
              <canvas id="overviewChart"></canvas>

              <div class="chart-center">
                <h3>Last</h3>

                <small>12 Months</small>
              </div>
            </div>

            <div class="mt-3">
              <span class="badge bg-primary">Rain</span>

              <span class="badge bg-warning text-dark">Sunny</span>

              <span class="badge bg-secondary">Cloudy</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="analytics.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My SkyCast APP</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <style>
  .bg-fixed {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    background: linear-gradient(to right, #74ebd5, #ACB6E5);

    z-index: -1; /* 👈 important */
  }
  nav {
  background: rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(10px);
}
</style>

  </head>
  <body>
    <div class="bg-fixed"></div>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">SkyCast APP</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">About This App</a>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Dropdown
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Bihar</a></li>
                <li><a class="dropdown-item" href="#">Seattle</a></li>
                <li><hr class="dropdown-divider" /></li>
                <li><a class="dropdown-item" href="#">Banglore</a></li>
              </ul>
            </li>
            <li class="nav-item">
              <a class="nav-link disabled" aria-disabled="true">Usage Guide</a>
            </li>
          </ul>
          <form class="d-flex" id="searchForm">
            <input
              class="form-control me-2"
              id="city"
              type="search"
              placeholder="Enter city"
            />
            <button class="btn btn-outline-success" type="submit">
              Search
            </button>
          </form>
        </div>
      </div>
    </nav>

    <div class="container">
      <h1 class="my-4 text-center">
        Weather for <span id="cityName">Bihar</span>
      </h1>
      <p id="errorMsg" style="color:red; text-align:center;"></p>
      <main>
        <div class="row row-cols-1 row-cols-md-3 mb-3 text-center">
          <!-- Temperature -->
          <div class="col">
            <div class="card mb-4 rounded-3 shadow-sm">
              <div class="card-header py-3">
                <h4>Temperature</h4>
              </div>
              <div class="card-body">
                <h1 id="temp">-- °C</h1>
                <p>Min: <span id="min_temp"></span></p>
                <p>Max: <span id="max_temp"></span></p>
              </div>
            </div>
          </div>

          <!-- Humidity -->
          <div class="col">
            <div class="card mb-4 rounded-3 shadow-sm">
              <div class="card-header py-3">
                <h4>Humidity</h4>
              </div>
              <div class="card-body">
                <h1 id="humidity">--</h1>
                <p>Feels Like: <span id="feels_like"></span></p>
                <p>Pressure: <span id="pressure"></span></p>
              </div>
            </div>
          </div>

          <!-- Wind -->
          <div class="col">
            <div class="card mb-4 rounded-3 shadow-sm border-primary">
              <div class="card-header py-3 text-bg-primary">
                <h4>Wind</h4>
              </div>
              <div class="card-body">
                <h1 id="wind">-- km/h</h1>
                <p>Direction: <span id="wind_dir"></span></p>
                <p>Condition: <span id="conditions"></span></p>
              </div>
            </div>
          </div>
        </div>
        <h2 class="display-6 text-center mb-4">
          Weather of Other Common Places
        </h2>
        <div class="container my-5">
  <div class="card shadow p-4">
    <h3 class="text-center mb-3">📅 Calendar</h3>
    <div class="text-center">
      <input type="date" id="calendar" class="form-control w-50 mx-auto">
    </div>
  </div>
</div>
        <thead>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="script.js"></script>
  </body>
</html>
